# docker-compose.yml
version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: kynda-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: kynda_calls
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - kynda-network
    command: mongod --replSet rs0 --bind_ip_all

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kynda-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kynda-network
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru

  # Coturn (TURN/STUN server)
  coturn:
    image: coturn/coturn:latest
    container_name: kynda-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    networks:
      - kynda-network
    command: -c /etc/coturn/turnserver.conf

  # Backend API server (multiple instances)
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kynda-backend-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/kynda_calls?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${PUBLIC_IP}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - mongodb
      - redis
    networks:
      - kynda-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kynda-backend-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/kynda_calls?authSource=admin&replicaSet=rs0
      REDIS_URI: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${PUBLIC_IP}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      - mongodb
      - redis
    networks:
      - kynda-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: kynda-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - backend-1
      - backend-2
    networks:
      - kynda-network

  # MinIO for recording storage
  minio:
    image: minio/minio:latest
    container_name: kynda-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - kynda-network
    command: server /data --console-address ":9001"

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: kynda-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - kynda-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: kynda-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - kynda-network

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  kynda-network:
    driver: bridge