# TURN server configuration

# Listening port
listening-port=3478
tls-listening-port=5349

# Listening IPs
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP (change this to your public IP)
external-ip=YOUR_PUBLIC_IP

# Authentication
lt-cred-mech
user=kynda:your_secure_password_here
realm=kynda.com

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose

# Security
fingerprint
no-multicast-peers
no-cli

# Performance
max-bps=1000000
bps-capacity=0

# Ports for relay
min-port=49152
max-port=65535
